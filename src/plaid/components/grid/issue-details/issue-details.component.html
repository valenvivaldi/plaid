<ng-container *ngIf="issue">
  <p
    class="parent-name"
    *ngIf="issue.fields.parent"
    (contextmenu)="showContextMenu($event, issue.fields.parent.key)"
    [title]="'Right-click to open in Jira'"
  >
    <svg class="icon-parent"><use href="assets/icons.svg#parent"></use></svg>
    <b>{{ issue.fields.parent.key }}</b>
    {{ issue.fields.parent.fields.summary }}
  </p>
  <p
    class="name"
    (contextmenu)="showContextMenu($event, issue.key)"
    [title]="'Right-click to open in Jira'"
  >
    <b>{{ issue.key }}</b>
    {{ issue.fields.summary }}
  </p>
  <p class="fields">
    <img
      *ngIf="issue.fields.issuetype"
      [src]="issue.fields.issuetype.iconUrl"
      [title]="issue.fields.issuetype.name"
      class="field-icon"
    >
    <img
      *ngIf="issue.fields.priority"
      [src]="issue.fields.priority.iconUrl"
      [title]="issue.fields.priority.name"
      class="field-icon"
    >
    <span class="status" *ngIf="issue.fields.status" [ngClass]="issue.fields.status.statusCategory?.colorName">
      {{ issue.fields.status.name }}
    </span>
    {{ getComponents() }}
  </p>
</ng-container>

<!-- Menú contextual -->
<div 
  *ngIf="contextMenuVisible" 
  class="context-menu"
  [style.left.px]="contextMenuX"
  [style.top.px]="contextMenuY"
  (click)="openInJira()"
>
  <div class="context-menu-item">
    🌐 Open in Jira
  </div>
</div>

<!-- Overlay para cerrar el menú -->
<div 
  *ngIf="contextMenuVisible" 
  class="context-menu-overlay"
  (click)="hideContextMenu()"
></div>
