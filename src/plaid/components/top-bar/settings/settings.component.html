<a class="button both-color-schemes toolbar-icon-button" (mousedown)="dropdownOpen = !dropdownOpen" [class.active]="dropdownOpen" title="Settings" aria-label="Settings">
  <span class="toolbar-emoji-icon" aria-hidden="true">⚙️</span>
</a>
<div class="dropdown" [class.open]="dropdownOpen">
  <!-- Parent component can accommodate stuff inside the settings dropdown that would not fit outside of it. -->
  <ng-content></ng-content>

  <div class="field-set">
    <label>Show only current day</label>
    <select
      class="input wide-dropdown"
      [tabIndex]="dropdownOpen ? 0 : -1"
      [ngModel]="showToday ? 1 : 0"
      (ngModelChange)="setShowToday($event === 1)"
      >
      <option [ngValue]="0">No</option>
      <option [ngValue]="1">Yes</option>
    </select>
  </div>
  <div class="field-set">
    <label>Working hours</label>
    <input
      class="input time-input"
      type="time"
      [tabIndex]="dropdownOpen ? 0 : -1"
      #workingHoursStart
      [max]="minutesToTimeString(workingHoursEndMinutes - 1)"
      [ngModel]="minutesToTimeString(workingHoursStartMinutes)"
      (ngModelChange)="setWorkingHoursStartMinutes(timeStringToMinutes(workingHoursStart.checkValidity() ? $event : null))"
      (blur)="workingHoursStart.value = minutesToTimeString(workingHoursStartMinutes)"
      />
    <label class="input-separator">to</label>
    <input
      class="input time-input"
      type="time"
      [tabIndex]="dropdownOpen ? 0 : -1"
      #workingHoursEnd
      [min]="minutesToTimeString(workingHoursStartMinutes + 1)"
      [ngModel]="minutesToTimeString(workingHoursEndMinutes)"
      (ngModelChange)="setWorkingHoursEndMinutes(timeStringToMinutes(workingHoursEnd.checkValidity() ? $event : null))"
      (blur)="workingHoursEnd.value = minutesToTimeString(workingHoursEndMinutes)"
      />
  </div>
  <div class="field-set">
    <label>Working days</label>
    <select
      class="input narrow-dropdown"
      [tabIndex]="dropdownOpen ? 0 : -1"
      [ngModel]="workingDaysStart?.toString()"
      (ngModelChange)="setWorkingDaysStart(+$event)"
      >
      @for (day of weekdays; track day; let i = $index) {
        <option [value]="i" [disabled]="i > workingDaysEnd">{{ day }}</option>
      }
    </select>
    <label class="input-separator">to</label>
    <select
      class="input narrow-dropdown"
      [tabIndex]="dropdownOpen ? 0 : -1"
      [ngModel]="workingDaysEnd?.toString()"
      (ngModelChange)="setWorkingDaysEnd(+$event)"
      >
      @for (day of weekdays; track day; let i = $index) {
        <option [value]="i" [disabled]="i < workingDaysStart">{{ day }}</option>
      }
    </select>
  </div>
  <div class="field-set">
    <label>Non-working days</label>
    <select
      class="input wide-dropdown"
      [tabIndex]="dropdownOpen ? 0 : -1"
      [ngModel]="hideWeekend ? 1 : 0"
      (ngModelChange)="setHideWeekend($event === 1)"
      >
      <option [ngValue]="0">Gray out</option>
      <option [ngValue]="1">Hide</option>
    </select>
  </div>
  <div class="field-set">
    <label>Periodic refreshing</label>
    <select
      class="input wide-dropdown"
      [tabIndex]="dropdownOpen ? 0 : -1"
      [ngModel]="refreshIntervalMinutes?.toString()"
      (ngModelChange)="setRefreshIntervalMinutes(+$event)"
      >
      <option value="0">Disabled</option>
      <option value="1">Every minute</option>
      <option value="2">Every 2 minutes</option>
      <option value="5">Every 5 minutes</option>
      <option value="10">Every 10 minutes</option>
      <option value="15">Every 15 minutes</option>
      <option value="30">Every 30 minutes</option>
    </select>
  </div>
  <div class="field-set">
    <label>Dark mode</label>
    <select
      class="input wide-dropdown"
      [tabIndex]="dropdownOpen ? 0 : -1"
      [ngModel]="theme"
      (ngModelChange)="setTheme($event)"
      >
      <option value="system">System default</option>
      <option value="dark">Enabled</option>
      <option value="light">Disabled</option>
    </select>
  </div>

  <!-- Quick Log Configuration Section -->
  <div class="section-divider"></div>
  <div class="section-title">⚡ Quick Log</div>

  <!-- Quick Log Time Configuration -->
  <div class="field-set">
    <label for="quick-log-time">⏰ Quick Log time (for both tasks and problems)</label>
    <div class="time-input-wrapper">
      <input
        id="quick-log-time"
        class="input time-input"
        type="time"
        [tabIndex]="dropdownOpen ? 0 : -1"
        [ngModel]="minutesToTimeString(quickLogTimeMinutes)"
        (ngModelChange)="setQuickLogTimeMinutes(timeStringToMinutes($event))"
        />
    </div>
  </div>

  <!-- Next Day Tasks Section -->
  <div class="subsection-divider"></div>
  <div class="subsection-title">📋 Next Day Tasks</div>

  <div class="field-set">
    <label for="quick-log-next-day">Status</label>
    <select
      id="quick-log-next-day"
      class="input wide-dropdown"
      [tabIndex]="dropdownOpen ? 0 : -1"
      [ngModel]="quickLogNextDayEnabled ? 1 : 0"
      (ngModelChange)="setQuickLogNextDayEnabled($event === 1)"
      >
      <option [ngValue]="0">Disabled</option>
      <option [ngValue]="1">Enabled</option>
    </select>
  </div>

  @if (quickLogNextDayEnabled) {
    <div class="field-set">
      <label for="quick-log-next-day-message">Default message</label>
      <input
        id="quick-log-next-day-message"
        class="input wide-input"
        type="text"
        [tabIndex]="dropdownOpen ? 0 : -1"
        [ngModel]="quickLogNextDayMessage"
        (ngModelChange)="setQuickLogNextDayMessage($event)"
        placeholder="Review pending tasks for tomorrow"
        />
    </div>
  }

  @if (quickLogNextDayEnabled) {
    <div class="field-set">
      <label for="quick-log-next-day-task-code">Task code (required for 1min worklog)</label>
      <input
        id="quick-log-next-day-task-code"
        class="input wide-input"
        type="text"
        [tabIndex]="dropdownOpen ? 0 : -1"
        [ngModel]="quickLogNextDayTaskCode"
        (ngModelChange)="setQuickLogNextDayTaskCode($event)"
        placeholder="e.g., PROJ-123 (leave empty to disable)"
        />
    </div>
  }

  <!-- Problems Found Section -->
  <div class="subsection-divider"></div>
  <div class="subsection-title">🚨 Problems Found</div>

  <div class="field-set">
    <label for="quick-log-problems">Status</label>
    <select
      id="quick-log-problems"
      class="input wide-dropdown"
      [tabIndex]="dropdownOpen ? 0 : -1"
      [ngModel]="quickLogProblemsEnabled ? 1 : 0"
      (ngModelChange)="setQuickLogProblemsEnabled($event === 1)"
      >
      <option [ngValue]="0">Disabled</option>
      <option [ngValue]="1">Enabled</option>
    </select>
  </div>

  @if (quickLogProblemsEnabled) {
    <div class="field-set">
      <label for="quick-log-problems-message">Default message</label>
      <input
        id="quick-log-problems-message"
        class="input wide-input"
        type="text"
        [tabIndex]="dropdownOpen ? 0 : -1"
        [ngModel]="quickLogProblemsMessage"
        (ngModelChange)="setQuickLogProblemsMessage($event)"
        placeholder="No issues found"
        />
    </div>
  }

  @if (quickLogProblemsEnabled) {
    <div class="field-set">
      <label for="quick-log-problems-task-code">Task code (required for 1min worklog)</label>
      <input
        id="quick-log-problems-task-code"
        class="input wide-input"
        type="text"
        [tabIndex]="dropdownOpen ? 0 : -1"
        [ngModel]="quickLogProblemsTaskCode"
        (ngModelChange)="setQuickLogProblemsTaskCode($event)"
        placeholder="e.g., PROJ-456 (leave empty to disable)"
        />
    </div>
  }

  <!-- Worklog Template Configuration Section -->
  <div class="section-divider"></div>
  <div class="section-title">📝 Worklog Template</div>

  <div class="field-set">
    <label for="worklog-default-template">Default comment template</label>
    <textarea
      id="worklog-default-template"
      class="input wide-input worklog-template-textarea"
      rows="6"
      [tabIndex]="dropdownOpen ? 0 : -1"
      [ngModel]="worklogDefaultTemplate"
      (ngModelChange)="setWorklogDefaultTemplate($event)"
      placeholder="Enter default template for worklog comments (leave empty for no default text)"
    ></textarea>
  </div>
</div>
