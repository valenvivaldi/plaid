<a
  class="button toolbar-icon-button"
  [class.both-color-schemes]="allowBothColorSchemes"
  [class.active]="zoomOutButtonActive"
  [class.disabled]="!isAbleToZoomOut"
  (click)="zoomOut()"
  title="Zoom out (Ctrl -)"
  aria-label="Zoom out"
>
  <span class="toolbar-emoji-icon" aria-hidden="true">➖</span>
</a>
<a
  class="button toolbar-icon-button"
  [class.both-color-schemes]="allowBothColorSchemes"
  [class.active]="zoomInButtonActive"
  [class.disabled]="!isAbleToZoomIn"
  (click)="zoomIn()"
  title="Zoom in (Ctrl +)"
  aria-label="Zoom in"
>
  <span class="toolbar-emoji-icon" aria-hidden="true">➕</span>
</a>
